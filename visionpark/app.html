<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VisionPark</title>
    <link rel="stylesheet" href="app.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<div id="search-container">
    <input type="text" id="search" placeholder="Search for a street...">
    <button id="searchButton" onclick="searchLocation()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z" fill="white"/></svg></button>
</div>
<div id="map"></div>

<div id="parkModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="parkName" ></h2>
            <span class="close">&times;</span>
        </div>
        <div class="modal-body">
            <p><b>Status:</b> <span id="parkStatus"></span></p>
            <p><b>Disabled Spaces:</b> <span id="disabledSpaces"></span></p>
            <p><b>Electric Spaces:</b> <span id="electricSpaces"></span></p>
            <p><b>Total Spaces:</b> <span id="totalSpaces"></span></p>
            <p><b>Paid Parking:</b> <span id="paidParking"></span></p>
        </div>
    </div>
</div>

<script>
    // Zoom control position
    document.addEventListener("DOMContentLoaded", () => {
        const controlContainer = document.querySelector('.leaflet-control-container');
        const zoomControl = document.querySelector('.leaflet-control-zoom');

        if (controlContainer && zoomControl) {
            // Dynamically set the position based on zoom control size
            const zoomRect = zoomControl.getBoundingClientRect();
            controlContainer.style.bottom = `${zoomRect.height + 20}px`; // Adjust as needed
            controlContainer.style.right = `${zoomRect.width + 20}px`; // Adjust as needed
        }
    });

    // Initialize the map
    let aveiro_coords = [40.6405, -8.646];
    let map = L.map('map').setView(aveiro_coords, 17);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // Define custom icons
    let CustomIcon = L.Icon.extend({
        options: {
            iconSize: [60, 95],
            iconAnchor: [15, 45],
        }
    });

    let markerRed = new CustomIcon({iconUrl: 'resources/marker_0.png'}),
        markerYellow = new CustomIcon({iconUrl: 'resources/marker_1.png'}),
        markerGreen = new CustomIcon({iconUrl: 'resources/marker_2.png'});

    // Park data
    let parks = [
        {"id": "urn:ngsi-ld:ParkingSpot:0001", "name": "Parque Estacionamento - Nossa Sra dos Aflitos", "full":1,"park_coordinates": [40.642562,-8.645188], "type": {"disable":2, "electric":4, "all":10 }, "paid":1},
        {"id": "urn:ngsi-ld:ParkingSpot:0002", "name": "Parque Mercado Manuel Firmino", "full":0,"park_coordinates": [40.641312,-8.648312], "type": {"disable":0, "electric":1, "all":9 }, "paid":0},
        {"id": "urn:ngsi-ld:ParkingSpot:0003", "name": "Parking Forum Aveiro", "full":2,"park_coordinates": [40.641188,-8.649563], "type": {"disable":1, "electric":2, "all":8 }, "paid":1},
        {"id": "urn:ngsi-ld:ParkingSpot:0004", "name": "Parque de Estacionamento - Estação de Aveiro", "full":2,"park_coordinates": [40.642688,-8.639312], "type": {"disable":1, "electric":10, "all":8 }, "paid":2},
    ];

    // Get modal elements
    let modal = document.getElementById("parkModal");
    let closeBtn = document.querySelector(".close");

    // Function to open the modal and populate data
    function openModal(park) {
        document.getElementById('parkName').textContent = park.name;

        document.getElementById('parkStatus').textContent = getStatusText(park.full);
        document.getElementById('disabledSpaces').textContent = park.type.disable || 'N/A';
        document.getElementById('electricSpaces').textContent = park.type.electric || 'N/A';
        document.getElementById('totalSpaces').textContent = park.type.all || 'N/A';

        let paidStatus = '';
        switch (park.paid) {
            case 0:
                paidStatus = 'Free';
                break;
            case 1:
                paidStatus = 'Paid';
                break;
            case 2:
                paidStatus = 'Subscription Only';
                break;
            default:
                paidStatus = 'Unknown';
        }
        document.getElementById('paidParking').textContent = paidStatus;

        modal.style.display = 'block';
    }

    // Helper function to get status text
    function getStatusText(fullValue) {
        switch (fullValue) {
            case 0:
                return 'Empty';
            case 1:
                return 'Almost Full';
            case 2:
                return 'Full';
            default:
                return 'Available';
        }
    }

    // Close modal logic
    closeBtn.onclick = function() {
        modal.style.display = 'none';
    };

    window.onclick = function(event) {
        if (event.target === modal) {
            modal.style.display = 'none';
        }
    };

    // Add markers to the map
    parks.forEach(park => {
        let markerIcon =
            park.full === 2 ? markerGreen :
                park.full === 1 ? markerYellow :
                    markerRed;

        let marker = L.marker(park.park_coordinates, {icon: markerIcon});

        marker.addTo(map);

        marker.on('click', () => openModal(park));
    });

    // Search for a location
    function searchLocation() {
        let searchQuery = document.getElementById('search').value.trim();

        if (!searchQuery) return;

        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(searchQuery)}`)
            .then(response => response.json())
            .then(data => {
                if (data.length > 0) {
                    let lat = data[0].lat;
                    let lon = data[0].lon;

                    map.setView([lat, lon], 17);

                    let customIcon = new CustomIcon({iconUrl: 'resources/marker.png'});
                    L.marker([lat, lon], {icon: customIcon}).addTo(map)


                    return true;
                }
                alert("Not Found!")
            });
    }

    // Add event listener to the search input to trigger search on Enter key press
    document.getElementById('search').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            searchLocation();
        }
    });
</script>
</body>
</html>
